services:
  - type: web
    name: kotiva-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: KOTIVA_PUBLIC_DIR
        value: dist
      - key: KOTIVA_MAP_USER_AGENT
        value: kotiva/1.0 (route estimation; https://www.kotiva.fi)
      - key: KOTIVA_REQUEST_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    domains:
      - www.kotiva.fi
      - kotiva.fi
